name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.19.0
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate generated bundle and lifecycle
        run: pnpm run check

      - name: Build static site
        run: pnpm run build

      - name: Inspect npm package contents
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm pack --dry-run --json ./skins/braun-control

  # PR 和非 main 分支只做校验。main 校验全部通过后，才串行部署生产站点。
  deploy:
    name: Deploy to server
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          if [ -z "${SSH_KEY}" ] || [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "Organization-level EC2 SSH secrets are not available to this repository"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      # DEPLOY_PATH 是项目独立的仓库 checkout；EC2_* 复用组织级 Secrets。
      # 公开路径使用仓库 Variables，未配置时采用 dsh-skin 的生产默认值。
      - name: Deploy on server
        env:
          REPOSITORY_PATH: ${{ secrets.DEPLOY_PATH }}
          STATIC_SITE_PATH: ${{ vars.DEPLOY_DIR || '/var/www/dsh-skin' }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_PORT: ${{ secrets.EC2_PORT }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          if [ -z "${REPOSITORY_PATH}" ]; then
            echo "Repository-level DEPLOY_PATH must be configured"
            exit 1
          fi
          if [ -z "${SSH_HOST}" ] || [ -z "${SSH_PORT}" ] || [ -z "${SSH_USER}" ]; then
            echo "Organization-level EC2 connection secrets are not available to this repository"
            exit 1
          fi
          printf -v repository_path_q '%q' "${REPOSITORY_PATH}"
          printf -v static_site_path_q '%q' "${STATIC_SITE_PATH}"
          ssh -p "${SSH_PORT}" \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "cd ${repository_path_q} && make deploy DEPLOY_DIR=${static_site_path_q}"

      - name: Post-deploy smoke check
        env:
          SMOKE_URL: ${{ vars.SITE_ORIGIN || 'https://dshskin.com' }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "${SMOKE_URL%/}/" > /dev/null; then
              echo "Public site smoke check passed"
              exit 0
            fi
            echo "Site is not ready; retrying (${attempt}/5)..."
            sleep 5
          done
          echo "Post-deploy smoke check failed"
          exit 1
