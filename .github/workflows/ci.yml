name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.19.0
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate generated bundle and lifecycle
        run: pnpm run check

      - name: Build static site
        run: pnpm run build

      - name: Inspect npm package contents
        env:
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: npm pack --dry-run --json ./skins/braun-control

  # PR 和非 main 分支只做校验。main 校验全部通过后，才串行部署生产站点。
  deploy:
    name: Deploy to server
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # DEPLOY_PATH 是服务器上的仓库 checkout；DEPLOY_DIR 是 Nginx 实际读取的
      # 静态目录。make deploy 会拉取 main、构建 out/，再同步到 DEPLOY_DIR。
      - name: Deploy on server
        env:
          REPOSITORY_PATH: ${{ secrets.DEPLOY_PATH }}
          STATIC_SITE_PATH: ${{ secrets.DEPLOY_DIR }}
        run: |
          if [ -z "${REPOSITORY_PATH}" ] || [ -z "${STATIC_SITE_PATH}" ]; then
            echo "DEPLOY_PATH and DEPLOY_DIR must both be configured"
            exit 1
          fi
          printf -v repository_path_q '%q' "${REPOSITORY_PATH}"
          printf -v static_site_path_q '%q' "${STATIC_SITE_PATH}"
          ssh -p "${{ secrets.EC2_PORT }}" \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd ${repository_path_q} && make deploy DEPLOY_DIR=${static_site_path_q}"

      - name: Post-deploy smoke check
        env:
          SMOKE_URL: ${{ secrets.SITE_ORIGIN }}
        run: |
          if [ -z "${SMOKE_URL}" ]; then
            echo "SITE_ORIGIN is not configured; skipping the public smoke check"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "${SMOKE_URL%/}/" > /dev/null; then
              echo "Public site smoke check passed"
              exit 0
            fi
            echo "Site is not ready; retrying (${attempt}/5)..."
            sleep 5
          done
          echo "Post-deploy smoke check failed"
          exit 1
