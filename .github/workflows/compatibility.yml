name: Upstream DSH compatibility

on:
  schedule:
    - cron: "31 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skins: ${{ steps.discover.outputs.skins }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Discover local skin directories
        id: discover
        run: |
          set -euo pipefail
          skins="$(node scripts/list-skins.mjs)"

          if [ "${skins}" = "[]" ]; then
            echo "No skin manifests found in skins/"
            exit 1
          fi

          printf 'skins=%s\n' "${skins}" >> "${GITHUB_OUTPUT}"

  probe:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        skin: ${{ fromJson(needs.discover.outputs.skins) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Check committed skin bundle
        run: node "skins/${{ matrix.skin }}/build.mjs" --check

      - name: Probe latest DSH profile lifecycle
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-${{ matrix.skin }}
          DSH_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          dsh_version="$(npx --yes @deepseek-ai/dsh@latest --version)"
          echo "Testing ${{ matrix.skin }} with DSH ${dsh_version}"
          npx --yes @deepseek-ai/dsh@latest plugin --profile web add "./skins/${{ matrix.skin }}"
          npx --yes @deepseek-ai/dsh@latest --profile web --dump-config > "${RUNNER_TEMP}/dsh-${{ matrix.skin }}-config.yml"
          grep --fixed-strings --quiet "dsh-skin-${{ matrix.skin }}" "${RUNNER_TEMP}/dsh-${{ matrix.skin }}-config.yml"
          printf '### %s\n\n- DSH: `%s`\n- Bundle registration: passed\n' \
            "${{ matrix.skin }}" \
            "${dsh_version}" >> "${GITHUB_STEP_SUMMARY}"
