<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深夜烘焙师 · Midnight Roaster — DSH Skin #16</title>
<link rel="stylesheet" href="./skin.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; grid-template-columns: 240px 1fr; background: #160F0B; color: #F6EDE2; }
  .demo_sidebarCol { padding: 18px 14px; display: flex; flex-direction: column; gap: 12px; }
  .demo_centerCol { padding: 28px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; }
  .demo_card { width: min(560px, 100%); padding: 18px; position: relative; }
  .demo_swatch { display: inline-flex; gap: 8px; margin-top: 8px; font-size: 12px; }
  .demo_dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid #5C4537; }
</style>
</head>
<body data-dsh-skin="midnight-roaster" data-ds-dark-theme="true">
  <aside class="demo_sidebarCol">
    <div style="font-weight:700;font-size:13px;">#16 · 深夜烘焙师</div>
    <button class="demo_newSession" type="button">+ 新建会话</button>
    <div style="font-size:12px;color:#C9B3A1;">Midnight Roaster</div>
  </aside>
  <main class="demo_centerCol">
    <div style="font-size:20px;font-weight:700;">深夜烘焙师 · Midnight Roaster</div>
    <p style="font-size:13px;color:#C9B3A1;max-width:460px;text-align:center;">深烘浓缩棕与暖黄爱迪生吊灯光束，手冲咖啡师与奶牛猫陪你度过深夜专注时光。</p>
    <div class="demo_composerStack" style="width:min(560px,100%);">
      <div class="demo_card">
        <div style="font-size:13px;color:#C9B3A1;">从一个新想法开始…</div>
        <div class="demo_swatch">
          <span><i class="demo_dot" style="background:#160F0B"></i> #160F0B</span>
          <span><i class="demo_dot" style="background:#F6EDE2"></i> #F6EDE2</span>
          <span><i class="demo_dot" style="background:#E8A464"></i> #E8A464</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
