<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鲸鱼娘 · Whale Courier</title>
<link rel="stylesheet" href="skin.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F3F8FD; color: #132B46; }
  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
  aside { display: flex; flex-direction: column; gap: 18px; padding: 24px; }
  aside button { padding: 8px 12px; }
  [role="treeitem"] { padding: 12px; }
  main { display: grid; align-content: center; padding: 32px; }
  .welcome { width: min(100%, 640px); margin: auto; text-align: center; }
  .courier { display: block; width: clamp(110px, 26vh, 190px); margin: 0 auto 12px; }
  h1 { margin: 0 0 22px; font-size: 26px; font-weight: 600; }
  .demo_card { position: relative; padding: 16px; text-align: start; }
  .courier-sidebar { width: 100%; height: 106px; margin-top: auto; object-fit: contain; object-position: right; border-radius: 14px; background: #D9EBF8; }
  [contenteditable] { min-height: 48px; padding: 4px; }
  footer { display: flex; align-items: center; justify-content: space-between; color: #495F77; }
  .notice { color: #2A5CBF; }
  @media (max-width: 620px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    aside { display: none; }
    main { padding: 20px; }
  }
</style>
<body data-dsh-skin="whale-courier">
  <div class="layout">
    <aside class="demo_sidebarCol">
      <strong>DeepSeek Harness</strong>
      <button class="demo_newSession" type="button">＋ 新会话</button>
      <small class="demo_sectionHeader">工作区</small>
      <div role="treeitem" aria-selected="true">新会话</div>
      <img class="courier-sidebar" src="courier-sidebar.webp" alt="">
    </aside>
    <main>
      <section class="welcome demo_composerStack">
        <img class="courier" src="courier.webp" width="448" alt="" style="height: auto">
        <h1>探索未至之境</h1>
        <div class="demo_card">
          <div contenteditable="true" role="textbox" aria-label="消息">描述你想要构建的内容</div>
          <footer>
            <small class="notice">鲸鱼娘 · 界面样张</small>
            <button class="demo_primary" type="button" aria-label="发送" disabled>↑</button>
          </footer>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
