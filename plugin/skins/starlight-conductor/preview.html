<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星穹列车长 · Starlight Conductor — DSH Skin #15</title>
<link rel="stylesheet" href="./skin.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; grid-template-columns: 240px 1fr; background: #0A0E22; color: #EEF2FF; }
  .demo_sidebarCol { padding: 18px 14px; display: flex; flex-direction: column; gap: 12px; }
  .demo_centerCol { padding: 28px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; }
  .demo_card { width: min(560px, 100%); padding: 18px; position: relative; }
  .demo_swatch { display: inline-flex; gap: 8px; margin-top: 8px; font-size: 12px; }
  .demo_dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid #42528A; }
</style>
</head>
<body data-dsh-skin="starlight-conductor" data-ds-dark-theme="true">
  <aside class="demo_sidebarCol">
    <div style="font-weight:700;font-size:13px;">#15 · 星穹列车长</div>
    <button class="demo_newSession" type="button">+ 新建会话</button>
    <div style="font-size:12px;color:#B0BDE0;">Starlight Conductor</div>
  </aside>
  <main class="demo_centerCol">
    <div style="font-size:20px;font-weight:700;">星穹列车长 · Starlight Conductor</div>
    <p style="font-size:13px;color:#B0BDE0;max-width:460px;text-align:center;">深邃星穹靛蓝与香槟金星轨，银河铁道列车长提灯领航你的每一次灵感跃迁。</p>
    <div class="demo_composerStack" style="width:min(560px,100%);">
      <div class="demo_card">
        <div style="font-size:13px;color:#B0BDE0;">从一个新想法开始…</div>
        <div class="demo_swatch">
          <span><i class="demo_dot" style="background:#0A0E22"></i> #0A0E22</span>
          <span><i class="demo_dot" style="background:#EEF2FF"></i> #EEF2FF</span>
          <span><i class="demo_dot" style="background:#F4C95D"></i> #F4C95D</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
