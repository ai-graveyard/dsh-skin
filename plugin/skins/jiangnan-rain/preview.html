<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江南烟雨 · Jiangnan Rain — DSH Skin #20</title>
<link rel="stylesheet" href="./skin.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; grid-template-columns: 240px 1fr; background: #EFF6F4; color: #15292B; }
  .demo_sidebarCol { padding: 18px 14px; display: flex; flex-direction: column; gap: 12px; }
  .demo_centerCol { padding: 28px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; }
  .demo_card { width: min(560px, 100%); padding: 18px; position: relative; }
  .demo_swatch { display: inline-flex; gap: 8px; margin-top: 8px; font-size: 12px; }
  .demo_dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid #9BB8B4; }
</style>
</head>
<body data-dsh-skin="jiangnan-rain">
  <aside class="demo_sidebarCol">
    <div style="font-weight:700;font-size:13px;">#20 · 江南烟雨</div>
    <button class="demo_newSession" type="button">+ 新建会话</button>
    <div style="font-size:12px;color:#456161;">Jiangnan Rain</div>
  </aside>
  <main class="demo_centerCol">
    <div style="font-size:20px;font-weight:700;">江南烟雨 · Jiangnan Rain</div>
    <p style="font-size:13px;color:#456161;max-width:460px;text-align:center;">宋瓷天青与江南斜雨细丝，执油纸伞的汉服少女携双燕与微粉梅韵入画。</p>
    <div class="demo_composerStack" style="width:min(560px,100%);">
      <div class="demo_card">
        <div style="font-size:13px;color:#456161;">从一个新想法开始…</div>
        <div class="demo_swatch">
          <span><i class="demo_dot" style="background:#EFF6F4"></i> #EFF6F4</span>
          <span><i class="demo_dot" style="background:#15292B"></i> #15292B</span>
          <span><i class="demo_dot" style="background:#226665"></i> #226665</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
