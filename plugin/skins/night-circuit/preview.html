<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜城骇客 · Night Circuit — DSH Skin #13</title>
<link rel="stylesheet" href="./skin.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; grid-template-columns: 240px 1fr; background: #070B12; color: #E6F4FF; }
  .demo_sidebarCol { padding: 18px 14px; display: flex; flex-direction: column; gap: 12px; }
  .demo_centerCol { padding: 28px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; }
  .demo_card { width: min(560px, 100%); padding: 18px; position: relative; }
  .demo_swatch { display: inline-flex; gap: 8px; margin-top: 8px; font-size: 12px; }
  .demo_dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid #2B4A66; }
</style>
</head>
<body data-dsh-skin="night-circuit" data-ds-dark-theme="true">
  <aside class="demo_sidebarCol">
    <div style="font-weight:700;font-size:13px;">#13 · 夜城骇客</div>
    <button class="demo_newSession" type="button">+ 新建会话</button>
    <div style="font-size:12px;color:#9BB8CE;">Night Circuit</div>
  </aside>
  <main class="demo_centerCol">
    <div style="font-size:20px;font-weight:700;">夜城骇客 · Night Circuit</div>
    <p style="font-size:13px;color:#9BB8CE;max-width:460px;text-align:center;">深邃黑青极客终端网格，搭配阿丽塔风格仿生机甲黑客立绘与等离子代码刃。</p>
    <div class="demo_composerStack" style="width:min(560px,100%);">
      <div class="demo_card">
        <div style="font-size:13px;color:#9BB8CE;">从一个新想法开始…</div>
        <div class="demo_swatch">
          <span><i class="demo_dot" style="background:#070B12"></i> #070B12</span>
          <span><i class="demo_dot" style="background:#E6F4FF"></i> #E6F4FF</span>
          <span><i class="demo_dot" style="background:#2EE6E6"></i> #2EE6E6</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
