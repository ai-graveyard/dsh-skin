<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡皮巴拉温泉 · Capy Onsen — DSH Skin #18</title>
<link rel="stylesheet" href="./skin.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; grid-template-columns: 240px 1fr; background: #F2F6F1; color: #162A29; }
  .demo_sidebarCol { padding: 18px 14px; display: flex; flex-direction: column; gap: 12px; }
  .demo_centerCol { padding: 28px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; }
  .demo_card { width: min(560px, 100%); padding: 18px; position: relative; }
  .demo_swatch { display: inline-flex; gap: 8px; margin-top: 8px; font-size: 12px; }
  .demo_dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid #A4BEB8; }
</style>
</head>
<body data-dsh-skin="capy-onsen">
  <aside class="demo_sidebarCol">
    <div style="font-weight:700;font-size:13px;">#18 · 卡皮巴拉温泉</div>
    <button class="demo_newSession" type="button">+ 新建会话</button>
    <div style="font-size:12px;color:#46615E;">Capy Onsen</div>
  </aside>
  <main class="demo_centerCol">
    <div style="font-size:20px;font-weight:700;">卡皮巴拉温泉 · Capy Onsen</div>
    <p style="font-size:13px;color:#46615E;max-width:460px;text-align:center;">桧木汤屋原木色调与青绿温泉雾气，头顶金柚的佛系水豚陪你稳住心态零焦虑。</p>
    <div class="demo_composerStack" style="width:min(560px,100%);">
      <div class="demo_card">
        <div style="font-size:13px;color:#46615E;">从一个新想法开始…</div>
        <div class="demo_swatch">
          <span><i class="demo_dot" style="background:#F2F6F1"></i> #F2F6F1</span>
          <span><i class="demo_dot" style="background:#162A29"></i> #162A29</span>
          <span><i class="demo_dot" style="background:#1B736C"></i> #1B736C</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
