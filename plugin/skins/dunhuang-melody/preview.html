<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>敦煌飞天 · Dunhuang Melody — DSH Skin #19</title>
<link rel="stylesheet" href="./skin.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; grid-template-columns: 240px 1fr; background: #FAF2E2; color: #2C1B14; }
  .demo_sidebarCol { padding: 18px 14px; display: flex; flex-direction: column; gap: 12px; }
  .demo_centerCol { padding: 28px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; }
  .demo_card { width: min(560px, 100%); padding: 18px; position: relative; }
  .demo_swatch { display: inline-flex; gap: 8px; margin-top: 8px; font-size: 12px; }
  .demo_dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid #CBB594; }
</style>
</head>
<body data-dsh-skin="dunhuang-melody">
  <aside class="demo_sidebarCol">
    <div style="font-weight:700;font-size:13px;">#19 · 敦煌飞天</div>
    <button class="demo_newSession" type="button">+ 新建会话</button>
    <div style="font-size:12px;color:#6B503F;">Dunhuang Melody</div>
  </aside>
  <main class="demo_centerCol">
    <div style="font-size:20px;font-weight:700;">敦煌飞天 · Dunhuang Melody</div>
    <p style="font-size:13px;color:#6B503F;max-width:460px;text-align:center;">莫高窟泥金、石绿与朱砂三色岩彩交辉，飞天仙子怀抱琵琶携飘带翩然而至。</p>
    <div class="demo_composerStack" style="width:min(560px,100%);">
      <div class="demo_card">
        <div style="font-size:13px;color:#6B503F;">从一个新想法开始…</div>
        <div class="demo_swatch">
          <span><i class="demo_dot" style="background:#FAF2E2"></i> #FAF2E2</span>
          <span><i class="demo_dot" style="background:#2C1B14"></i> #2C1B14</span>
          <span><i class="demo_dot" style="background:#AD2E20"></i> #AD2E20</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
