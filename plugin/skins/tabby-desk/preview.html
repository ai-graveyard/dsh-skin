<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>橘猫桌伴 · Tabby Desk — DSH Skin #17</title>
<link rel="stylesheet" href="./skin.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; grid-template-columns: 240px 1fr; background: #FCF6EC; color: #2D1C12; }
  .demo_sidebarCol { padding: 18px 14px; display: flex; flex-direction: column; gap: 12px; }
  .demo_centerCol { padding: 28px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; }
  .demo_card { width: min(560px, 100%); padding: 18px; position: relative; }
  .demo_swatch { display: inline-flex; gap: 8px; margin-top: 8px; font-size: 12px; }
  .demo_dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid #D1B598; }
</style>
</head>
<body data-dsh-skin="tabby-desk">
  <aside class="demo_sidebarCol">
    <div style="font-weight:700;font-size:13px;">#17 · 橘猫桌伴</div>
    <button class="demo_newSession" type="button">+ 新建会话</button>
    <div style="font-size:12px;color:#6B503B;">Tabby Desk</div>
  </aside>
  <main class="demo_centerCol">
    <div style="font-size:20px;font-weight:700;">橘猫桌伴 · Tabby Desk</div>
    <p style="font-size:13px;color:#6B503B;max-width:460px;text-align:center;">午后百叶窗斜阳暖白与龟背竹抹茶绿，软萌大橘猫趴在客制化键盘旁陪你写代码。</p>
    <div class="demo_composerStack" style="width:min(560px,100%);">
      <div class="demo_card">
        <div style="font-size:13px;color:#6B503B;">从一个新想法开始…</div>
        <div class="demo_swatch">
          <span><i class="demo_dot" style="background:#FCF6EC"></i> #FCF6EC</span>
          <span><i class="demo_dot" style="background:#2D1C12"></i> #2D1C12</span>
          <span><i class="demo_dot" style="background:#A3470B"></i> #A3470B</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
