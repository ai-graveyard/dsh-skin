<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太极水墨 · Taiji Ink — DSH Skin #14</title>
<link rel="stylesheet" href="./skin.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: grid; grid-template-columns: 240px 1fr; background: #F4F0E6; color: #1C1B18; }
  .demo_sidebarCol { padding: 18px 14px; display: flex; flex-direction: column; gap: 12px; }
  .demo_centerCol { padding: 28px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; }
  .demo_card { width: min(560px, 100%); padding: 18px; position: relative; }
  .demo_swatch { display: inline-flex; gap: 8px; margin-top: 8px; font-size: 12px; }
  .demo_dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid #BEB6A6; }
</style>
</head>
<body data-dsh-skin="taiji-ink">
  <aside class="demo_sidebarCol">
    <div style="font-weight:700;font-size:13px;">#14 · 太极水墨</div>
    <button class="demo_newSession" type="button">+ 新建会话</button>
    <div style="font-size:12px;color:#5C564D;">Taiji Ink</div>
  </aside>
  <main class="demo_centerCol">
    <div style="font-size:20px;font-weight:700;">太极水墨 · Taiji Ink</div>
    <p style="font-size:13px;color:#5C564D;max-width:460px;text-align:center;">宣纸米白与松烟浓墨勾勒太极剑仙，剑穗一点朱砂红点睛，刚柔并济留白清雅。</p>
    <div class="demo_composerStack" style="width:min(560px,100%);">
      <div class="demo_card">
        <div style="font-size:13px;color:#5C564D;">从一个新想法开始…</div>
        <div class="demo_swatch">
          <span><i class="demo_dot" style="background:#F4F0E6"></i> #F4F0E6</span>
          <span><i class="demo_dot" style="background:#1C1B18"></i> #1C1B18</span>
          <span><i class="demo_dot" style="background:#B33020"></i> #B33020</span>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
